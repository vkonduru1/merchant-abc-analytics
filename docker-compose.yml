version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: abc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-merchant_abc}
      POSTGRES_USER: ${POSTGRES_USER:-abc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abc_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abc_user} -d ${POSTGRES_DB:-merchant_abc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant vector DB (Phase 2 — placeholder) ────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: abc_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── FastAPI backend ─────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: abc_api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-merchant_abc}
      POSTGRES_USER: ${POSTGRES_USER:-abc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abc_dev_password}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEBUG: ${DEBUG:-true}
    volumes:
      - ./api:/app          # hot-reload: mounts source for development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── React frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abc_frontend
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src    # hot-reload for development
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: https://merchant-abc.veda-konduru.net/api
    depends_on:
      - api

  # ── Nginx reverse proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: abc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  qdrant_data:
